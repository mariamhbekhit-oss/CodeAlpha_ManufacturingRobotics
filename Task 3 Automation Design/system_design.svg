<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#334155"/></marker></defs><rect width="1100" height="790" fill="#f8fafc"/><g font-family="Arial" fill="#0f172a"><text x="40" y="48" font-size="26" font-weight="bold">Sensor-controlled conveyor: functional design</text><text x="40" y="80" font-size="17">Concept only. Safety relay independently removes motion enable.</text><rect x="45" y="120" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="152" text-anchor="middle" font-size="18">Part / exit sensors</text><text x="160.0" y="178" text-anchor="middle" font-size="14">24 V digital inputs</text><rect x="435" y="120" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="550.0" y="152" text-anchor="middle" font-size="18">Standard PLC</text><text x="550.0" y="178" text-anchor="middle" font-size="14">sequence + diagnostics</text><rect x="825" y="120" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="940.0" y="152" text-anchor="middle" font-size="18">Drive + diverter</text><text x="940.0" y="178" text-anchor="middle" font-size="14">process commands</text><rect x="45" y="290" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="322" text-anchor="middle" font-size="18">E-stop + guard</text><text x="160.0" y="348" text-anchor="middle" font-size="14">dual-channel concept</text><rect x="435" y="290" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="550.0" y="322" text-anchor="middle" font-size="18">Safety relay</text><text x="550.0" y="348" text-anchor="middle" font-size="14">monitored manual reset</text><rect x="825" y="290" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="940.0" y="322" text-anchor="middle" font-size="18">STO / energy isolation</text><text x="940.0" y="348" text-anchor="middle" font-size="14">application-dependent</text><rect x="435" y="435" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="550.0" y="467" text-anchor="middle" font-size="18">Feedback to PLC</text><text x="550.0" y="493" text-anchor="middle" font-size="14">diagnostics only</text><rect x="45" y="595" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="627" text-anchor="middle" font-size="18">RUN</text><text x="160.0" y="653" text-anchor="middle" font-size="14">belt on; part arrival</text><rect x="435" y="595" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="550.0" y="627" text-anchor="middle" font-size="18">SORT</text><text x="550.0" y="653" text-anchor="middle" font-size="14">settle / extend / retract</text><rect x="825" y="595" width="230" height="85" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="940.0" y="627" text-anchor="middle" font-size="18">VERIFY</text><text x="940.0" y="653" text-anchor="middle" font-size="14">exit edge; count +1</text><path d="M275 163L435 163" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M665 163L825 163" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M275 333L435 333" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M665 333L825 333" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M550 375L550 435" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M275 638L435 638" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M665 638L825 638" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="40" y="745" font-size="16">Any fault: outputs off; clear cell, reset, then a separate fresh Start. No automatic restart.</text></g></svg>